name: Build

on: [push, pull_request]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install dependencies
              run: npm ci
            - name: Vitest
              uses: Forsakringskassan/vitest-config@efa58b53f5c690ed25dd5cd15af8ea7903968520 # v2.6.0
            - name: Build
              run: npm run --if-present build

    vite:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                vite-version: [5.x, 6.x, 7.x, 8.x]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24.x
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run --if-present build
            - name: Downgrade esbuild # older vite versions require esbuild 0.27
              run: npm install esbuild@0.27
            - name: Install Vite ${{ matrix.vite-version }}
              run: npm install --no-save $(npx -y npm-min-peer vite --major ${{ matrix.vite-version }} --with-name)
            - name: Testbed (commonjs)
              run: |
                  rm -rf testbed/dist
                  npm pkg -w testbed set type=commonjs
                  npm run -w testbed build
                  npm run -w testbed test
            - name: Testbed (esm)
              run: |
                  rm -rf testbed/dist
                  npm pkg -w testbed set type=module
                  npm run -w testbed build
                  npm run -w testbed test

    typescript:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                typescript-version: [5.x, 6.x]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24.x
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run --if-present build
            - name: Install Typescript ${{ matrix.typescript-version }}
              run: npm install --no-save $(npx -y npm-min-peer typescript --major ${{ matrix.typescript-version }} --with-name)
            - name: Testbed
              run: |
                  npm pkg -w testbed set type=module
                  npm run -w testbed build
                  npm run -w testbed test

    testbed:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24.x
            - name: Install dependencies
              run: |
                  npm ci
            - name: Build
              run: npm run --if-present build
            - name: Testbed (commonjs)
              run: |
                  rm -rf testbed/dist
                  npm pkg -w testbed set type=commonjs
                  npm run -w testbed build
                  npm run -w testbed test
            - name: Testbed (esm)
              run: |
                  rm -rf testbed/dist
                  npm pkg -w testbed set type=module
                  npm run -w testbed build
                  npm run -w testbed test
